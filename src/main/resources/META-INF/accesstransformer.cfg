# MrCrayfish's Vehicle Mod - access transformers
# NOTE: the AT parser rejects a line that is a bare '#' - every comment line must have text.

# These replace the 1.16.5-era ObfuscationReflectionHelper lookups in
# com.mrcrayfish.vehicle.client.CameraHelper. Reflection by SRG name cannot work on
# 1.21.1 (Forge runs on official mappings since 1.20.2), and the signatures changed
# too - move/getMaxZoom take float now, not double. Widening these to public turns a
# runtime crash into a compile-time check.
# Camera#left is NOT listed: Camera#getLeftVector() is already public.

public net.minecraft.client.Camera m_90584_(DDD)V # setPosition
public net.minecraft.client.Camera m_90568_(FFF)V # move
public net.minecraft.client.Camera m_90566_(F)F # getMaxZoom
