import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'maven-publish'

version = "0.45.2-1.21.1"
group = "com.mrcrayfish"
archivesBaseName = "vehicle-mod"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

minecraft {
    mappings channel: "official", version: "1.21.1"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vehicle {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vehicle {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'vehicle', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods {
                vehicle {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://maven.minecraftforge.net/"
    }
    maven {
        url "https://libraries.minecraft.net/"
    }
    maven {
        url = "https://www.cursemaven.com"
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        def notation = details.requested.toString()
        if (notation.contains(':natives-macos-patch')) {
            details.useTarget(
                details.requested.group + ':' +
                details.requested.name + ':' +
                details.requested.version + ':natives-macos-arm64'
            )
        }
    }
}





dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.15'

    // TODO: Update these dependencies to 1.21.1 compatible versions
    // compile fg.deobf('curse.maven:obfuscate-289380:3336021')
    // compile fg.deobf('curse.maven:controllable-317269:3519536')
    // compile fg.deobf('curse.maven:configured-457570:3546348')
    // compile fg.deobf('curse.maven:catalogue-459701:3529457')
}

processResources {
    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
            File file -> file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
        }
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Vehicle Mod",
            "Specification-Vendor": "MrCrayfish",
            "Specification-Version": "1",
            "Implementation-Title": "Vehicle Mod",
            "Implementation-Version": project.version,
            "Implementation-Vendor" : "MrCrayfish",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def reobfFile = file("$buildDir/reobfJar/output.jar")
def reobfArtifact = artifacts.add('default', reobfFile) {
    type 'jar'
    builtBy 'reobfJar'
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact reobfArtifact
        }
    }
    repositories {
        maven {
            url "file:///X:/localmaven/mcmods"
        }
    }
}